name: Plugin tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  wordpress:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            wordpress: '6.2'
            database: sqlite
          - php: '8.3'
            wordpress: '6.8.3'
            database: sqlite
          - php: '7.4'
            wordpress: '6.2'
            database: mysql
          - php: '8.3'
            wordpress: '6.8.3'
            database: mysql
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: alify-ci-root
          MYSQL_DATABASE: alify_test
          MYSQL_USER: alify_test
          MYSQL_PASSWORD: alify-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -palify-ci-root"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      DB_ENGINE: ${{ matrix.database }}
      ALIFY_TEST_DIR: /home/runner/.cache/alify-cf-integration-${{ matrix.wordpress }}-${{ matrix.database }}
      ALIFY_ALLOW_MYSQL_TESTS: '1'
      ALIFY_MYSQL_HOST: 127.0.0.1:3306
      ALIFY_MYSQL_DATABASE: alify_test
      ALIFY_MYSQL_USER: alify_test
      ALIFY_MYSQL_PASSWORD: alify-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, mysqli, mbstring, fileinfo, gd
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test
      - name: PHP syntax and isolated contracts
        run: |
          find . -path ./node_modules -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/php-unit.php
      - name: Database runner safety guards
        run: bash tests/integration/guards.sh
      - name: Real WordPress integration (${{ matrix.database }})
        env:
          WP_VERSION: ${{ matrix.wordpress }}
        run: bash tests/integration/run.sh
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - name: Real browser Classic and Gutenberg flows
        env:
          ALIFY_WP_ROOT: /home/runner/.cache/alify-cf-integration-${{ matrix.wordpress }}-${{ matrix.database }}/wordpress
          ALIFY_BROWSER_FIXTURE: /home/runner/.cache/alify-cf-integration-${{ matrix.wordpress }}-${{ matrix.database }}/browser.json
        run: |
          php tests/browser/seed.php
          php -S 0.0.0.0:8080 -t "$ALIFY_WP_ROOT" tests/browser/router.php > /tmp/alify-browser-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; php tests/browser/cleanup.php' EXIT
          node -e 'const http=require("http"); let tries=0; function ready(){http.get("http://127.0.0.1:8080/wp-login.php", r=>{r.resume(); if(r.statusCode!==200){console.log("::error::Browser server returned HTTP "+r.statusCode);process.exit(1)}}).on("error",()=>{if(++tries>30)process.exit(1);setTimeout(ready,1000)})} ready()'
          npm run test:browser
          test ! -s "$(dirname "$ALIFY_BROWSER_FIXTURE")/debug.log" || { while IFS= read -r line; do printf '::error title=WordPress browser debug::%s\n' "$line"; done < "$(dirname "$ALIFY_BROWSER_FIXTURE")/debug.log"; exit 1; }
  optional-adapters:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: alify-ci-root
          MYSQL_DATABASE: alify_test_providers
          MYSQL_USER: alify_test
          MYSQL_PASSWORD: alify-ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -palify-ci-root"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      DB_ENGINE: mysql
      WP_VERSION: '6.9'
      ALIFY_TEST_DIR: /home/runner/.cache/alify-cf-providers
      ALIFY_WP_ROOT: /home/runner/.cache/alify-cf-providers/wordpress
      ALIFY_ALLOW_MYSQL_TESTS: '1'
      ALIFY_MYSQL_HOST: '127.0.0.1:3306'
      ALIFY_MYSQL_DATABASE: alify_test_providers
      ALIFY_MYSQL_USER: alify_test
      ALIFY_MYSQL_PASSWORD: alify-ci-only
      ALIFY_PROVIDER_VENDOR: /home/runner/.cache/alify-cf-vendor/vendor
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, dom, mbstring, zip, intl, gd
          tools: composer:v2
          coverage: none
      - name: Native WordPress 6.9 Abilities and core development contracts
        run: bash tests/integration/run.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned provider fixtures outside the checkout
        run: |
          curl --fail --location --retry 3 https://github.com/woocommerce/woocommerce/releases/download/10.3.6/woocommerce.zip -o /tmp/woocommerce.zip
          echo '29c4998ee54bd1187f6038635924fca0cc8da3216e4a1c73876a49fc1e33347b  /tmp/woocommerce.zip' | sha256sum --check
          unzip -q /tmp/woocommerce.zip -d "$ALIFY_WP_ROOT/wp-content/plugins"
          git clone --depth 1 --branch 3.9.1 https://github.com/polylang/polylang.git "$ALIFY_WP_ROOT/wp-content/plugins/polylang"
          composer install --working-dir="$ALIFY_WP_ROOT/wp-content/plugins/polylang" --no-dev --no-interaction --no-progress --no-scripts --prefer-dist
          npm ci --prefix "$ALIFY_WP_ROOT/wp-content/plugins/polylang" --ignore-scripts --no-audit --no-fund
          npm run build --prefix "$ALIFY_WP_ROOT/wp-content/plugins/polylang"
          mkdir -p "$(dirname "$ALIFY_PROVIDER_VENDOR")"
          composer require --working-dir="$(dirname "$ALIFY_PROVIDER_VENDOR")" timber/timber:2.3.3 --no-interaction --no-progress --no-scripts --prefer-dist
      - name: Native HPOS, Polylang, Timber and Abilities contracts
        env:
          ALIFY_NATIVE_PROVIDERS: '1'
        run: |
          trap 'status=$?; if [[ -s "$ALIFY_TEST_DIR/debug.log" ]]; then while IFS= read -r line; do printf "::error title=Native adapter debug::%s\n" "$line"; done < "$ALIFY_TEST_DIR/debug.log"; fi; exit "$status"' ERR
          php tests/integration/provider-install.php
          php tests/integration/providers.php
          test ! -s "$ALIFY_TEST_DIR/debug.log" || { cat "$ALIFY_TEST_DIR/debug.log"; exit 1; }
