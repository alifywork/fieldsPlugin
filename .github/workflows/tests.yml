name: Plugin tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  wordpress:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            wordpress: '6.2'
          - php: '8.3'
            wordpress: '6.8.3'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, mysqli, mbstring, fileinfo, gd
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test
      - name: PHP syntax and isolated contracts
        run: |
          find . -path ./node_modules -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/php-unit.php
      - name: Real WordPress integration (SQLite)
        env:
          WP_VERSION: ${{ matrix.wordpress }}
        run: bash tests/integration/run.sh
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - name: Real browser Classic and Gutenberg flows
        env:
          ALIFY_WP_ROOT: /home/runner/.cache/alify-cf-integration-${{ matrix.wordpress }}/wordpress
          ALIFY_BROWSER_FIXTURE: /home/runner/.cache/alify-cf-integration-${{ matrix.wordpress }}/browser.json
        run: |
          php tests/browser/seed.php
          php -S 0.0.0.0:8080 -t "$ALIFY_WP_ROOT" tests/browser/router.php > /tmp/alify-browser-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; php tests/browser/cleanup.php' EXIT
          node -e 'const http=require("http"); let tries=0; function ready(){http.get("http://127.0.0.1:8080/wp-login.php", r=>{r.resume(); if(r.statusCode!==200)process.exit(1)}).on("error",()=>{if(++tries>30)process.exit(1);setTimeout(ready,1000)})} ready()'
          npm run test:browser
          test ! -s "$(dirname "$ALIFY_BROWSER_FIXTURE")/debug.log" || { cat "$(dirname "$ALIFY_BROWSER_FIXTURE")/debug.log"; exit 1; }
